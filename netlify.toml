# WordFlow V1 is a static PWA. It has no server functions or environment variables.
[build]
  publish = "public"

# Let the installed app open any client-side route while preserving real files.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
